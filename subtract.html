<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtraction</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 280px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 18px;
      border: 2px solid #ccc;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    input:focus {
      outline: none;
      border-color: #4a7dff;
    }

    .minus {
      font-size: 24px;
      margin-bottom: 12px;
      color: #666;
    }

    #result {
      margin-top: 8px;
      font-size: 28px;
      font-weight: bold;
      color: #222;
    }
  </style>
</head>
<body>
  <div class="card">
    <input type="number" id="first" placeholder="First number">
    <div class="minus">−</div>
    <input type="number" id="second" placeholder="Second number">
    <div id="result">= ?</div>
  </div>

  <script>
    const first = document.getElementById("first");
    const second = document.getElementById("second");
    const result = document.getElementById("result");

    function subtract() {
      if (first.value === "" || second.value === "") {
        result.textContent = "= ?";
        return;
      }
      const answer = Number(first.value) - Number(second.value);
      result.textContent = "= " + answer;
    }

    // Recalculate every time you type in either box
    first.addEventListener("input", subtract);
    second.addEventListener("input", subtract);
  </script>
</body>
</html>
